name: CI

on:
  push:
    branches: [main, master, "phase/**", "feat/**", "fix/**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Reference Tests
        run: pnpm test

      - name: Guard — no accidental SCI edits in packages
        run: |
          if git diff --name-only origin/${{ github.base_ref || 'main' }}...HEAD 2>/dev/null | grep -E '^specs/scientific/' ; then
            echo "SCI specs changed — requires constitutional trigger label/process"
            exit 1
          fi
          echo "No SCI path changes detected (or base unavailable — skip soft)"
        continue-on-error: true
